name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Validate composite action manifest
        run: scripts/check-action-manifest.sh
      - name: Bootstrap pinned dependencies
        uses: ./.github/actions/bootstrap-toolchains
      - name: Verify canonical JNS ABI
        run: scripts/check-jns-abi.sh
      - name: Install application dependencies
        run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run stage1:guard
      - name: Check Computer Service through JamScript
        run: npm run computer:check
      - name: Build Computer Service through JamScript
        run: npm run computer:artifact:build -- "$RUNNER_TEMP/jam-computer-artifact"
      - name: Verify reviewed Computer artifact
        run: npm run computer:artifact:verify
      - name: Verify release guards
        run: npm run release:guard
