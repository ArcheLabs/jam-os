name: Deploy JAM Computer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  VITE_JAM_MODE: live
  VITE_MINIJAM_NETWORK_NAME: MiniJAM
  VITE_MINIJAM_NODE_RPC_URL: ${{ vars.MINIJAM_NODE_RPC_URL }}
  VITE_MINIJAM_WORK_RPC_URL: ${{ vars.MINIJAM_WORK_RPC_URL }}
  VITE_MINIJAM_DEPLOYMENT_RPC_URL: ${{ vars.MINIJAM_DEPLOYMENT_RPC_URL }}
  VITE_DOOM_SERVICE_ID: ${{ vars.MINIJAM_DOOM_SERVICE_ID }}
  VITE_DOOM_GATEWAY_URL: ${{ vars.MINIJAM_DOOM_GATEWAY_URL }}
  VITE_COMPUTER_SERVICE_ARTIFACT_URL: ./computer-service.bin
  VITE_COMPUTER_SERVICE_MIN_ITEM_GAS: "10000000"
  VITE_COMPUTER_SERVICE_MIN_MEMO_GAS: "1"

jobs:
  build:
    name: Build JAM Computer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bootstrap canonical toolchains
        uses: ./.github/actions/bootstrap-toolchains

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build canonical Computer Service artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          .toolchain/minijam-client/scripts/compile-service c services/computer/src/service.c /tmp/computer-service O0
          cp /tmp/computer-service/service.blob public/computer-service.bin
          test -s public/computer-service.bin
          code_hash="$(node -e "const fs=require('fs');const {blake2AsHex}=require('@polkadot/util-crypto');process.stdout.write(blake2AsHex(fs.readFileSync('public/computer-service.bin'),256))")"
          echo "VITE_COMPUTER_SERVICE_CODE_HASH=${code_hash}" >> "${GITHUB_ENV}"

          {
            echo "## Canonical Computer Service"
            echo
            echo "Code hash: \`${code_hash}\`"
            echo "Artifact: \`computer-service.bin\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build legacy DOOM simulation artifact
        shell: bash
        run: |
          set -euo pipefail
          .toolchain/minijam-client/scripts/compile-service c services/doom/src/service.c /tmp/doom-service O0
          cp /tmp/doom-service/service.blob public/doom-service.bin
          test -s public/doom-service.bin
          doom_code_hash="$(node -e "const fs=require('fs');const {blake2AsHex}=require('@polkadot/util-crypto');process.stdout.write(blake2AsHex(fs.readFileSync('public/doom-service.bin'),256))")"
          {
            echo "## Legacy DOOM Simulation Service"
            echo
            echo "Code hash: \`${doom_code_hash}\`"
            echo "Artifact: \`doom-service.bin\`"
            echo "Artifact kind: \`legacy-doom-simulation\`"
            echo "Configured service ID: \`${VITE_DOOM_SERVICE_ID:-not configured}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build
        run: npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/computer-service.bin
          test -s dist/doom-service.bin
          grep -R --fixed-strings "${VITE_COMPUTER_SERVICE_CODE_HASH}" dist >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
