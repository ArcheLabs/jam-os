name: Deploy JAM Computer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PLAYGROUND_API_URL: https://playground.minijam.xyz/api/v1
  VITE_JAM_MODE: live
  VITE_MINIJAM_NETWORK_NAME: MiniJAM
  VITE_PLAYGROUND_API_URL: https://playground.minijam.xyz/api/v1
  VITE_DOOM_SERVICE_ID: ${{ vars.MINIJAM_DOOM_SERVICE_ID }}
  VITE_COMPUTER_SERVICE_ARTIFACT_URL: ./computer-service.bin
  VITE_COMPUTER_SERVICE_MIN_ITEM_GAS: "10000000"
  VITE_COMPUTER_SERVICE_MIN_MEMO_GAS: "1"

jobs:
  build:
    name: Build JAM Computer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build canonical Computer Service artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          jq -Rs \
            '{language:"c", source:., optimization:"O0"}' \
            services/computer/src/service.c \
            > /tmp/computer-service-build.json

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --header 'content-type: application/json' \
            --data-binary @/tmp/computer-service-build.json \
            "${PLAYGROUND_API_URL}/build" \
            > /tmp/computer-service-build-response.json

          jq -e '
            .success == true and
            (.blobBase64 | type == "string" and length > 0) and
            (.codeHash | type == "string" and test("^0x[0-9a-fA-F]{64}$"))
          ' /tmp/computer-service-build-response.json >/dev/null

          jq -r '.blobBase64' /tmp/computer-service-build-response.json \
            | base64 --decode \
            > public/computer-service.bin

          test -s public/computer-service.bin
          code_hash="$(jq -r '.codeHash' /tmp/computer-service-build-response.json)"
          echo "VITE_COMPUTER_SERVICE_CODE_HASH=${code_hash}" >> "${GITHUB_ENV}"

          {
            echo "## Canonical Computer Service"
            echo
            echo "Code hash: \`${code_hash}\`"
            echo "Artifact: \`computer-service.bin\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build canonical DOOM Service artifact
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs \
            '{language:"c", source:., optimization:"O0"}' \
            services/doom/src/service.c \
            > /tmp/doom-service-build.json

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --header 'content-type: application/json' \
            --data-binary @/tmp/doom-service-build.json \
            "${PLAYGROUND_API_URL}/build" \
            > /tmp/doom-service-build-response.json

          jq -e '
            .success == true and
            (.blobBase64 | type == "string" and length > 0) and
            (.codeHash | type == "string" and test("^0x[0-9a-fA-F]{64}$"))
          ' /tmp/doom-service-build-response.json >/dev/null

          jq -r '.blobBase64' /tmp/doom-service-build-response.json \
            | base64 --decode \
            > public/doom-service.bin

          test -s public/doom-service.bin
          doom_code_hash="$(jq -r '.codeHash' /tmp/doom-service-build-response.json)"
          {
            echo "## Canonical DOOM Service"
            echo
            echo "Code hash: \`${doom_code_hash}\`"
            echo "Artifact: \`doom-service.bin\`"
            echo "Configured service ID: \`${VITE_DOOM_SERVICE_ID:-not configured}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build
        run: npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/computer-service.bin
          test -s dist/doom-service.bin
          grep -R --fixed-strings "${VITE_COMPUTER_SERVICE_CODE_HASH}" dist >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
