name: Deploy JAM Computer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  VITE_JAM_MODE: live
  VITE_MINIJAM_NETWORK_NAME: MiniJAM
  VITE_MINIJAM_NODE_RPC_URL: ${{ vars.MINIJAM_NODE_RPC_URL }}
  VITE_MINIJAM_WORK_RPC_URL: ${{ vars.MINIJAM_WORK_RPC_URL }}
  VITE_MINIJAM_DEPLOYMENT_RPC_URL: ${{ vars.MINIJAM_DEPLOYMENT_RPC_URL }}
  VITE_MINIJAM_GENESIS_HASH: ${{ vars.MINIJAM_GENESIS_HASH }}
  VITE_COMPUTER_SERVICE_ARTIFACT_URL: ./computer-service.bin
  VITE_COMPUTER_SERVICE_MIN_ITEM_GAS: "10000000"
  VITE_COMPUTER_SERVICE_MIN_MEMO_GAS: "1"

jobs:
  build:
    name: Build JAM Computer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate composite action manifest
        run: scripts/check-action-manifest.sh

      - name: Bootstrap canonical toolchains
        uses: ./.github/actions/bootstrap-toolchains

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify promoted Computer Service artifact
        shell: bash
        run: |
          set -euo pipefail
          npm run computer:artifact:verify
          mkdir -p public
          cp artifacts/computer/stage1/scriptc/service.blob public/computer-service.bin
          test -s public/computer-service.bin
          expected_hash="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('artifacts/computer/stage1/scriptc/build.json')).code_hash)")"
          code_hash="$(node --input-type=module -e "import fs from 'node:fs';import {blake2AsHex} from '@polkadot/util-crypto';process.stdout.write(blake2AsHex(fs.readFileSync('public/computer-service.bin'),256))")"
          test "${code_hash,,}" = "${expected_hash,,}"
          echo "VITE_COMPUTER_SERVICE_CODE_HASH=${code_hash}" >> "${GITHUB_ENV}"

          {
            echo "## Canonical Computer Service"
            echo
            echo "Code hash: \`${code_hash}\`"
            echo "Artifact: \`computer-service.bin\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate production environment
        run: npm run production:env:check

      - name: Build
        run: npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/computer-service.bin
          grep -R --fixed-strings "${VITE_COMPUTER_SERVICE_CODE_HASH}" dist >/dev/null
          if find dist -iname '*doom*' -type f -print -quit | grep -q .; then
            echo "Doom executable artifact is present in the production Pages bundle" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
