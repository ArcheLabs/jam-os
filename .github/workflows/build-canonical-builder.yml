name: Build canonical Computer builder

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build canonical builder
        run: docker build --platform linux/amd64 --file toolchains/builder/Dockerfile --tag ghcr.io/archelabs/jam-computer-builder:${GITHUB_SHA} toolchains/builder
      - name: Validate canonical builder environment
        run: docker run --rm --platform linux/amd64 --env JAM_CANONICAL_BUILDER=1 --env JAM_CANONICAL_BUILDER_VERSION=1 --volume "$PWD:/workspace" --workdir /workspace ghcr.io/archelabs/jam-computer-builder:${GITHUB_SHA} node scripts/check-builder-env.mjs
      - name: Publish canonical builder and report digest
        shell: bash
        run: |
          set -euo pipefail
          docker push ghcr.io/archelabs/jam-computer-builder:${GITHUB_SHA} | tee "$RUNNER_TEMP/builder-push.log"
          digest="$(sed -n 's/^digest: sha256:/sha256:/p' "$RUNNER_TEMP/builder-push.log" | tail -1)"
          test -n "$digest"
          {
            echo "## Canonical builder"
            echo
            echo "Image: `ghcr.io/archelabs/jam-computer-builder`"
            echo "Digest: `${digest}`"
            echo "Update `toolchains/builder.lock` with this digest and the Dockerfile SHA before enabling main CI."
          } >> "$GITHUB_STEP_SUMMARY"
