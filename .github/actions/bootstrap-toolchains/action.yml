name: Bootstrap pinned dependencies
description: Checkout and verify the pinned JamScript and MiniJAM client revisions.
runs:
  using: composite
  steps:
    - name: Read dependency pins
      id: pins
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/read-toolchain-pins.mjs" >> "$GITHUB_OUTPUT"

    - name: Checkout pinned JamScript
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.pins.outputs.JAMSCRIPT_CHECKOUT_REPOSITORY }}
        ref: ${{ steps.pins.outputs.JAMSCRIPT_REVISION }}
        path: .toolchain/JamScript

    - name: Verify JamScript pin
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/scripts/check-jamscript-pin.sh" .toolchain/JamScript

    - name: Checkout pinned MiniJAM client
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.pins.outputs.MINIJAM_CLIENT_CHECKOUT_REPOSITORY }}
        ref: ${{ steps.pins.outputs.MINIJAM_CLIENT_REVISION }}
        path: .toolchain/minijam-client

    - name: Verify MiniJAM client pin
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/scripts/check-minijam-client-pin.sh" .toolchain/minijam-client

    - name: Verify dependency layout
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/scripts/check-toolchain-layout.sh"

    - name: Summarize pinned dependencies
      shell: bash
      run: |
        {
          echo "## Pinned dependencies"
          echo
          echo "JamScript: \`${{ steps.pins.outputs.JAMSCRIPT_REVISION }}\`"
          echo "MiniJAM client: \`${{ steps.pins.outputs.MINIJAM_CLIENT_REVISION }}\`"
          echo "Node: \`$(node --version)\`"
          echo "npm: \`$(npm --version)\`"
        } >> "$GITHUB_STEP_SUMMARY"
